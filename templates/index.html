<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScriptSense — AI Text Detector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Brand Header ── */
    .brand {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeUp 0.6s ease forwards;
    }
    .brand-name {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-tag {
      font-size: 0.72rem;
      letter-spacing: 3px;
      color: #4b5563;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .brand-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #7c3aed, #60a5fa);
      margin: 14px auto 0;
      border-radius: 999px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card ── */
    .container {
      background: #13131a;
      border: 1px solid #1f1f2e;
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.12);
      animation: fadeUp 0.7s ease 0.1s both;
    }

    /* ── Inner heading ── */
    .inner-heading {
      text-align: center;
      margin-bottom: 6px;
    }
    .inner-heading h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #e0e0e0;
      letter-spacing: 1px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.78rem;
      color: #4b5563;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      background: #0d0d14;
      border: 1px solid #1f1f2e;
      border-radius: 12px;
      padding: 6px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff;
      box-shadow: 0 0 14px #7c3aed55;
    }
    .tab:not(.active):hover { color: #a78bfa; }

    /* ── Tab content ── */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed #1f1f2e;
      border-radius: 14px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s;
      margin-bottom: 16px;
      background: #0d0d14;
    }
    .drop-zone:hover {
      border-color: #7c3aed;
      background: #7c3aed0a;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .drop-zone p {
      color: #4b5563;
      font-size: 0.82rem;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .drop-zone p.hint { color: #374151; font-size: 0.75rem; margin-top: 6px; }

    #fileName {
      text-align: center;
      font-size: 0.82rem;
      color: #a78bfa;
      margin-bottom: 14px;
      min-height: 20px;
      letter-spacing: 0.5px;
    }

    /* ── Textarea ── */
    textarea {
      width: 100%;
      height: 180px;
      background: #0d0d14;
      border: 1px solid #1f1f2e;
      border-radius: 12px;
      padding: 14px;
      color: #e0e0e0;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: #7c3aed; }
    textarea::placeholder { color: #374151; }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 20px #7c3aed44;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 0 28px #7c3aed66;
    }

    input[type="file"] { display: none; }

    /* ── Footer ── */
    .footer {
      margin-top: 24px;
      font-size: 0.7rem;
      color: #1f1f2e;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      animation: fadeUp 0.8s ease 0.2s both;
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <div class="brand">
    <div class="brand-name">⚡ ScriptSense</div>
    <div class="brand-tag">C-Based Linguistic Analysis Engine v1.0</div>
    <div class="brand-divider"></div>
  </div>

  <!-- Main Card -->
  <div class="container">

    <div class="inner-heading">
      <h2>🤖 AI Text Detector</h2>
    </div>
    <p class="subtitle">Detect machine-generated content instantly</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('upload', this)">📁 Upload File</button>
      <button class="tab"        onclick="switchTab('paste',  this)">📝 Paste Text</button>
    </div>

    <!-- Upload Tab -->
    <div id="upload" class="tab-content active">
      <form action="/analyze" method="POST" enctype="multipart/form-data">
        <div class="drop-zone"
          onclick="document.getElementById('fileInput').click()"
          ondragover="event.preventDefault()"
          ondrop="handleDrop(event)">
          <div class="icon">📄</div>
          <p>Click to browse or drag &amp; drop</p>
          <p class="hint">Supports &nbsp;.txt &nbsp;.pdf &nbsp;.docx</p>
        </div>
        <input type="file" id="fileInput" name="file" accept=".txt,.pdf,.docx"
          onchange="showFileName(this)">
        <div id="fileName">No file chosen</div>
        <button type="submit" class="btn">🔍 &nbsp;Analyse Text</button>
      </form>
    </div>

    <!-- Paste Tab -->
    <div id="paste" class="tab-content">
      <form action="/analyze" method="POST" enctype="multipart/form-data">
        <textarea name="text" placeholder="Paste your text here..."></textarea>
        <button type="submit" class="btn">🔍 &nbsp;Analyse Text</button>
      </form>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">ScriptSense &mdash; Powered by a C-based engine</div>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      btn.classList.add('active');
    }

    function showFileName(input) {
      const name = input.files[0] ? input.files[0].name : 'No file chosen';
      document.getElementById('fileName').textContent = name;
    }

    function handleDrop(e) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) {
        const input = document.getElementById('fileInput');
        const dt    = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        document.getElementById('fileName').textContent = file.name;
      }
    }
  </script>
</body>
</html>
